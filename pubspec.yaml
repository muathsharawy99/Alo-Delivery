name: alo_delivery
description: "Alo Delivery — deliveries for clients, couriers and merchants."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flash: ^3.1.1
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  get_it: ^9.3.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  lottie: ^3.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie_files/
    - assets/translations/
